services:
  icecast:
    build: ./icecast
    container_name: local-radio-icecast
    env_file:
      - .env
    ports:
      - "${ICECAST_HOST_PORT:-18080}:8000"
    restart: unless-stopped

  radio:
    build: .
    container_name: local-radio
    env_file:
      - .env
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - icecast
    restart: unless-stopped
